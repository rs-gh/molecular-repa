paper_n256_struct_afdb:
  # AFDB-Swissprot inverse-folding probe (only). dihedral + distance probes
  # are dropped because AFDB coordinates are AF2 predictions; the
  # residue_type field — the only target the IF probe needs — is the real
  # UniProt sequence. CATH on AFDB lives in paper_n256_cath_afdb; this
  # profile is its real-data structural-probe companion.
  #

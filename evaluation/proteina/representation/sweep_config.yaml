# ─── Paper-table residue/pair-level structural sweeps (added 2026-05-14) ────
# Companion sweeps to paper_n{128,256}_cath using the three new structural
# probes (inverse_folding, dihedral, distance) plus task-specific trivial-
# geometric baselines. Reuse the paper_cath_defaults sample sizes (n_train=
# 5000, n_eval≈val-clipped, t=1.0 only, linear head, 15 epochs) so the new
# probe rows are directly comparable in scale to the existing CATH rows.
#
# Per-probe expected wall time at n_train=5000 / n_eval≈3000 (CPU-bound
# probe-fits, cf. cath ~10s/level): inverse_folding ~30s/layer (20-way CE
# over ~250k residues), dihedral ~30s/layer (4-way regression), distance
# ~120s/layer (pair-stratified sampling, ~600k pairs). Net per-ckpt
# ~30 fits × 60s mean ≈ 30 min × 22 ckpts ≈ 11 h serial; parallelise
# across ckpts via the existing extract+probe-from-cache split.

_paper_struct_defaults: &paper_struct_defaults
  n_train: 5000
  n_eval: 4999
  head_type: linear
  # 8 epochs (lowered 2026-05-14 from 15): linear heads on per-residue
  # features saturate well before 15 epochs at n_train=5000. Empirical:
  # IF top-1 plateaus by epoch 5, dihedral MAE by epoch 6, distance MAE
  # by epoch 8. The drop keeps the per-checkpoint sweep inside the 15-min
  # SLURM array slot (was ~30 min at epochs=15 / n_per_bucket=200; cf.
  # 2026-05-14 TLE batch). Distance probe also dropped n_per_bucket
  # 200→100 (see distance.py).
  probe_epochs: 8
  probe_lr: 0.001
  probe_seed: 42
  manifest_seed: 42
  train_manifest_version: train_v1
  eval_manifest_version: eval_v1
  timesteps: "1.0"
  probes: "inverse_folding,dihedral,distance"
  cath_levels: ""             # not used by these probes
  cath_min_per_class: 3
  # Generic baselines apply to all three probe kinds; trivial-geometric
  # baselines are auto-gated to their target probe via BASELINE_PROBE_KINDS
  # in pretrain_probe_sweep.py (knn_dist→inverse_folding, local_frame→
  # dihedral, seqsep_pair→distance).
  baselines: "untrained_proteina,random_gauss,seq_onehot,trained_noise,knn_dist,local_frame,seqsep_pair"

paper_n128_struct_afdb:
  # AFDB-Swissprot inverse-folding probe at n=128. IF-only (residue_type is
  # the real UniProt sequence — the only AFDB target with unambiguously
  # real values). Companion to paper_n256_struct_afdb at smaller max_size.
  <<: *paper_struct_defaults
  max_size: 128
  n_eval: 1586
  probes: "inverse_folding"
  baselines: "untrained_proteina,random_gauss,seq_onehot,trained_noise,knn_dist"
  output_dir: results/paper/n128_paper_struct_afdb

# ─── Serialised CATH + IF + dihedral profiles (added 2026-05-16) ────────────
# Run cath (C/A/T levels) + inverse_folding + dihedral in ONE task per ckpt,
# skipping the expensive `distance` probe (which dominates struct wall at
# ~170 s/layer ≈ 28 min/ckpt). Net per-ckpt wall ≈ 20 min cath +
# (5 s IF + 8 s dih) × 10 layers + shared extract ≈ ~25 min. Suitable when
# the distance probe rows are not needed but cath + IF + dih should land in
# a single JSONL with shared extraction cost (vs running cath / struct as
# two separate array jobs).
#
# Baselines: union of cath + struct minus seqsep_pair (the distance-gated
# trivial baseline). local_frame stays (gated to dihedral); knn_dist stays

# Canonical parameter profiles for run_sweep.py.
#
# Pass --config <name> to load a named profile as base defaults; any
# additional CLI flags override individual fields.  Every production sweep
# should specify a --config so that deviations from the canonical settings
# are explicit overrides visible in the job log, not silent argparse defaults.
#
# Profile-to-protocol map (see README.md for full layout):
#   n128 / n256 / n512 / n128_L4_bs80  -> results/lite/  (Pipeline A, single-step)
#   pretrained_probe                    -> results/paper/contact_max256 (Pipeline B)
#   paper_n128_cath / paper_n256_cath   -> results/{pretrained_probe_paper_n128, paper/n256_paper_cath}
#
# The "convergence" (multi-step n=512) sweep is NOT a config profile — it's
# launched by passing per-step CLI flags to scripts/lite/run_sweep.py and writes
# to results/convergence/n512_convergence/.
#
# Usage examples:
#   sbatch run_probes.sh --sweep --config n128
#   sbatch run_probes.sh --sweep --config n128 --runs esm_repa_l0_128,esm_repa_l4_128
#   sbatch run_probes.sh --sweep --config n256 --n_proteins 50   # override one field

_defaults: &defaults
  n_proteins: 200
  manifest_version: null        # null = legacy cursor-first (v1)
  manifest_seed: 42
  cath_level: T
  heads: both
  seeds: "42"
  timesteps: "1.0,0.75,0.5"
  baselines: "random_rank,distance_only,seq_onehot,random_gauss,untrained_proteina"
  rep_dim_random: 512
  skip_gearnet: false

n128:
  <<: *defaults
  max_size: 128
  output_dir: results/lite/n128_lite

n256:
  <<: *defaults
  max_size: 256
  output_dir: results/lite/n256_lite

n512:
  <<: *defaults
  max_size: 512
  output_dir: results/lite/n512_lite

# n=128 L4 bs=80 sweep: same parameters as n128 but writes to a separate output
# dir so the canonical n128_lite/ results stay untouched. Pass --runs on the
# CLI to select the bs80 sweep entries (baseline_128_bs80, repa_l4_128_bs80,
# repa_l4_128_bs80_lr3x, repa_l4_128_random).
#
# Renamed 2026-05-06 from n128_bs80_sweep -> n128_L4_bs80 to make the
# layer-4-only scope explicit (cf. n128, which is a L0/L4/L9 layer ablation).
n128_L4_bs80:
  <<: *defaults
  max_size: 128
  output_dir: results/lite/n128_L4_bs80_lite

# ─── Pretrained-probe pipeline (pretrain_probe_sweep.py) ─────────────────────
#
# REPA-paper-style probing: contact probe trains on a large train.lmdb sample,
# evaluates on a fixed val.lmdb manifest. Writes to a separate output dir and
# does not overwrite the in-place-split sweep results.
#
# N_train is the output of the Phase 1 sample-size curve (sample_size_probe.py).
# Revisit when AFDB pretraining is added.

pretrained_probe:
  n_train: 1000              # elbow from sample_size_probe.py on 2026-04-24
                             # (500→0.868, 1K→0.891, 2K→0.899, 5K→0.903, 10K→0.904;
                             # 1K is sufficient for run-ranking; saves 4× compute vs 5K)
  n_eval: 500                # val.lmdb has 4,999 proteins total; bump to 4999 for
                             # paper-quality eval (~40 min extra per 162-probe sweep)
  max_size: 256
                             # TODO(2026-04-24): max_size=256 truncates inputs for
                             # the *_512_sm runs (trained at n=512). Probe results
                             # are still structurally valid but do not match the
                             # training-time receptive field. For paper-quality
                             # 512-context numbers on those 4 runs, run a separate
                             # sweep with --runs baseline_512_sm,repa_l{0,4,9}_512_sm
                             # --max_size 512.
  head_type: mlp             # match legacy default; swap to linear for paper table
  probe_epochs: 15
  probe_lr: 0.001
  probe_seed: 42
  manifest_seed: 42
  train_manifest_version: train_v1
  eval_manifest_version: eval_v1
  timesteps: "1.0,0.75,0.5,0.0"  # 2026-04-26: extended to cover full t range;
                                   # t=1.0 is clean input (easy), t=0.0 is pure noise
                                   # (tests learned structural priors)
  probes: "contact,cath"     # 2026-04-28: which probes to run per (run,step,
                             # layer,t). Any subset of {contact, cath,
                             # inverse_folding, dihedral, distance}. The
                             # last three are residue-/pair-level structural
                             # probes added 2026-05-14 (Jamasb et al. 2024
                             # ProteinWorkshop §D.7-8); each emits its own
                             # probe_kind in JSONL/CSV. Override on the CLI
                             # via --probes for one-off sweeps; flip the
                             # default here once they're paper-bound.
  cath_levels: "T"           # CATH levels to probe (only used if 'cath' is in
                             # probes). "C,A,T,H" for the full per-depth
                             # breakdown.
  cath_min_per_class: 3
  output_dir: results/paper/contact_max256

# ─── Paper-table CATH sweeps (pretrain_probe_sweep.py) ──────────────────────
# CATH-only rep-quality companion to the n=128 / n=256 paper tables. One row
# per generation-quality row. Probes C+A+T levels; clean t=1.0 only.
# Pretrained DFS-60M included via PRETRAINED_CHECKPOINTS (12-layer); the
# RUN_SCHEDULES aliases pretrained_dfs_60m_n{128,256}_paper would 10-layer-
# index it incorrectly and are intentionally not in runs lists.

_paper_cath_defaults: &paper_cath_defaults
  # n_train=5000: trade-off between T-level class coverage and probe-fit
  # wall time. sklearn LogisticRegression (lbfgs, single-threaded) at
  # n_train=10000 took ~20s/level on the smoke; saga+n_jobs=-1 didn't help
  # because n_jobs is a no-op since sklearn 1.8. Halving n_train to 5000
  # cuts probe-fit to ~10s/level. T vocab shrinks from ~700 to ~400 classes
  # (still meaningful; A/C unaffected). Net per-ckpt: ~10s × 30 fits +
  # ~50s extraction = ~6 min. Full job at 22 ckpts ≈ 2.5h parallel.
  # Cost of n_eval scales only extraction (predict_proba is milliseconds);
  # keep n_eval=4999 for stable T-level macro-F1.
  n_train: 5000
  n_eval: 4999
  head_type: linear
  probe_epochs: 15
  probe_lr: 0.001
  probe_seed: 42
  manifest_seed: 42
  train_manifest_version: train_v1
  eval_manifest_version: eval_v1
  timesteps: "1.0"
  probes: "cath"
  cath_levels: "C,A,T"
  cath_min_per_class: 3
  # Baselines added 2026-05-14: random transformer / random Gaussian / AA-only
  # one-hot. Rows tagged probe_kind=cath at negative sentinel layers (see
  # lib/sources.py). Cheap: one forward of fresh-init 60M + two tiny tensor
  # ops, run once per sweep regardless of checkpoint count.
  # trained_noise added 2026-05-14: trained baseline checkpoint with x_t
  # drawn from the model's own reference distribution at t=0.0 — "good
  # model + uninformative coords". Per-profile checkpoint set via
  # baseline_trained_noise_run (n128: baseline_128_bs80_step200k;
  # n256: baseline_256_ep21).
  baselines: "untrained_proteina,random_gauss,seq_onehot,trained_noise"

paper_n128_cath_afdb:
  # AFDB-Swissprot CATH probe at n=128. Companion to paper_n128_cath.
  # AFDB val ≤128 residues: 1586 total (827 labelled with Gene3D cath_code).
  # Launch with `--lmdb_dataset afdb` so the SLURM wrapper points the LMDB
  # source at /rds/.../afdb_swissprot/lmdb.
  <<: *paper_cath_defaults
  max_size: 128
  n_eval: 1586
  output_dir: results/paper/n128_paper_cath_afdb
  baseline_trained_noise_run: baseline_afdb_128_bs80_step200k
  # Same 30-run list as paper_n128_cath.
  runs: "baseline_128_bs80_step200k,repa_l0_128_bs80_steplast,repa_l0_128_bs80_step200k,repa_l4_128_bs80_step200k,repa_l9_128_bs80_steplast,repa_l9_128_bs80_step200k,repa_l4_128_random_step200k,repa_l4_128_pw_structure_step100k,repa_l4_128_pw_torsional_step100k,repa_mpnn_l4_128_bs80_step200k,repa_esm_l4_128_step200k,baseline_128_bs24_step200k,baseline_128_bs24_step400k,baseline_128_bs80_lr3x_step200k,repa_l4_128_bs24_step200k,repa_l4_128_bs24_step400k,repa_l4_128_bs80_lr3x_steplast,repa_l4_128_bs80_lambda025_step200k,repa_l4_128_bs80_lambda1_step200k,repa_l4_128_bs80_lambda2_steplast,repa_l4_128_bs80_wd1e2_step200k,repa_l0_128_per_residue_step400k,repa_l4_128_per_residue_step400k,repa_l9_128_per_residue_step400k,baseline_afdb_128_bs80_step200k,baseline_afdb_128_bs80_step400k,repa_l4_afdb_128_bs80_step200k,repa_mpnn_l4_afdb_128_bs80_step200k,repa_mpnn_l4_afdb_128_bs80_step400k,baseline_afdb_128_bs80_step600k,baseline_afdb_128_bs80_step800k,baseline_afdb_128_bs80_step1000k,baseline_afdb_128_bs80_step1200k,repa_l4_afdb_128_bs80_step600k,repa_mpnn_l4_afdb_128_bs80_step600k,repa_mpnn_l4_afdb_128_bs80_step800k,repa_mpnn_l4_afdb_128_bs80_step1000k,pretrained_dfs_60m"

paper_n128_cath:
  <<: *paper_cath_defaults
  max_size: 128
  # val.lmdb has 4,999 total proteins, but only ~1,237 are ≤128 residues.
  # Using all of them; the eval set is smaller than at n256 (4,999) but
  # still gives ~30 samples/class for CATH-A and ~10/class for CATH-T —
  # adequate for stable macro-F1 on the surviving vocab.
  n_eval: 1237
  output_dir: results/paper/n128_paper_cath
  baseline_trained_noise_run: baseline_128_bs80_step200k

paper_n256_cath_afdb:
  # Same protocol as paper_n256_cath but probe trains AND evals against
  # AFDB-Swissprot CATH labels (Gene3D InterPro HMM hits, not PDB-structural
  # CATH). Companion to paper_n256_cath so the dataset-ablation block can
  # be reproduced against AFDB-distribution labels. Launch with
  # `--lmdb_dataset afdb` so the SLURM wrapper stages
  # /rds/.../afdb_swissprot/lmdb instead of /rds/.../pdb_train/lmdb.
  #
  # AFDB val.lmdb has 4522 entries; ~62% (2791) carry a non-empty cath_code.
  # Setting n_eval=4521 (all L<=256) lets the eval-time labelled filter pick
  # the ~2791 in-vocab proteins naturally (unlabelled drop out of accuracy).
  # n_train=5000 matches the PDB profile; ~3100 of those will carry a label,
  # which is still well past sample-size saturation (cf. sample_size_curve).
  <<: *paper_cath_defaults
  max_size: 256
  n_eval: 4521
  output_dir: results/paper/n256_paper_cath_afdb
  baseline_trained_noise_run: baseline_afdb_256_ep20
  # Same 28-run list as paper_n256_cath — the comparison axis is the probe
  # dataset, not the trunk set.
  runs: "baseline_256_ep21,repa_l0_256_ep26,repa_l4_256_ep22,repa_l9_256_ep25,repa_l9_256_ep17,repa_l4_256_ep13_step300k,repa_l4_256_ep31_step500k,repa_l4_256_random_ep17,baseline_afdb_256_ep20,repa_l4_afdb_256_ep20,baseline_afdb_256_step400k,baseline_afdb_256_step700k,baseline_afdb_256_step900k,repa_l4_afdb_256_step400k,repa_l4_afdb_256_step700k,repa_mpnn_l4_afdb_256_step400k,repa_mpnn_l9_afdb_256_step400k,repa_mpnn_l9_afdb_256_step700k,repa_l0_256_per_sample_steplast,repa_l4_256_per_sample_step400k,repa_l9_256_per_sample_steplast,repa_esm_l9_t30_256_steplast,repa_mpnn_l4_256_per_residue_step300k,repa_l4_256_per_residue_lambda1_step200k,repa_l4_256_per_residue_lambda1_step300k,repa_l4_256_per_residue_lambda2_step200k,repa_l4_256_per_residue_lambda2_step300k,pretrained_dfs_60m"

paper_n256_cath:
  <<: *paper_cath_defaults

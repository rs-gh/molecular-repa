# Named profiles for generation/scripts/run_sweep.py.
# Pass --config <name>; any CLI flag overrides individual fields.
#
# Profile taxonomy (mirrors representation/sweep_config.yaml naming):
#
#   n512_convergence  -- full 11-12 point log-spaced step schedule for n=512 runs.
#                        Use for training-progression / convergence curves.
#                        ~11-12 array tasks per run, ~35 min each.
#                        Step rationale and batch-size arithmetic documented in
#                        evaluation/proteina/lib/checkpoints.py.
#
#   n128, n256, n512_sm -- single sample-matched checkpoint per run.
#                        Use for cross-size / cross-method comparisons at equal
#                        training budget. 4 array tasks each (one per run variant).
#                        Sample-matching arithmetic documented in lib/checkpoints.py.
#
# Usage:
#   # n=512 convergence (11 tasks for baseline, 12 for repa variants)
#   python evaluation/proteina/generation/scripts/run_sweep.py --config n512_convergence --dry_run
#   sbatch --array=0-10 hpc-scripts/proteina/evaluation/generation/run_sweep.sh --config n512_convergence
#
#   # sample-matched (4 tasks each)
#   sbatch --array=0-3 hpc-scripts/proteina/evaluation/generation/run_sweep.sh --config n128
#   sbatch --array=0-3 hpc-scripts/proteina/evaluation/generation/run_sweep.sh --config n256
#   sbatch --array=0-3 hpc-scripts/proteina/evaluation/generation/run_sweep.sh --config n512_sm
#
#   # backfill a single run within a profile
#   sbatch --array=0-11 hpc-scripts/proteina/evaluation/generation/run_sweep.sh \
#     --config n512_convergence --runs repa_l4
#
#   # ad-hoc single checkpoint (no --array needed)
#   sbatch hpc-scripts/proteina/evaluation/generation/run_sweep.sh \
#     --ckpt_path /rds/...ckpt --ckpt_label myrun_100k \
#     --config_name inference/inference_fid_60m_baseline_lite
#
#   # arbitrary checkpoint list (one task per row; bypasses RUN_SCHEDULES)
#   #   ckpts.tsv rows: '<label>\t<ckpt_path>\t<config_name>' (# for comments)
#   sbatch --array=0-N-1 hpc-scripts/proteina/evaluation/generation/run_sweep.sh \
#     --ckpts_file /path/to/ckpts.tsv --output_dir results/adhoc_run
#
#   # rerun only one metric on existing PDBs (merges into per-checkpoint CSV,
#   # does not clobber other metric columns)
#   sbatch --array=0-3 hpc-scripts/proteina/evaluation/generation/run_sweep.sh \
#     --config n128 --metrics novelty_foldseek

_defaults: &defaults
  seed: 42
  # ProteinMPNN(8 seqs) -> ESMFold -> scRMSD on N PDBs. Dual-semantic (TODO
  # below):
  #   - With designability_lengths set (paper profiles): N PDBs PER LENGTH.
  #   - With designability_lengths unset (legacy profiles n128/n256/n512_*/
  #     n128_L4_bs80, where the inference config typically generates a single
  #     length anyway): N is a GLOBAL cap on the whole pool.
  # TODO: tighten this. Set designability_lengths on every profile (matching
  # the inference config's nres_lens), then drop the global-cap fallback in
  # evaluate.compute_designability_metrics so the name is unambiguous.
  designability_subset_per_length: 100
  skip_fid: false
  cath_subset: 100            # 2026-04-27: GearNet+CATH-head scoring on N generated PDBs.
                              # Emits _res_cath_topclass_conf_mean / _res_cath_n_unique /
                              # _res_cath_distribution_kl / _res_cath_entropy. Requires
                              # --cath_head_path pointing at the artifact from
                              # build_cath_classifier.py; missing artifact = skip with
                              # a warning. 0 disables the metric outright.
  # Novelty: max TM-score against training-set centroids; <0.5 => novel fold.
  # Built by hpc-scripts/proteina/data_prep/precompute_centroids.sh
  # (length-binned greedy TM-cluster, max_per_length_group=200, bin_width=16).
  # All current profiles use PDB-trained models; AFDB profiles would override
  # this to /rds/.../centroids_afdb_swissprot.pt.
  centroid_path: /rds/user/sr2173/hpc-work/proteina/data/centroids_pdb.pt

  # Foldseek-based novelty (paper-style protocol). Prebuilt DBs live under
  # /rds/.../foldseek_dbs/{pdb,afdb_swissprot}/db -- built one-off by
  # hpc-scripts/proteina/data_prep/download_foldseek_dbs.sh. Empty string
  # disables the Foldseek path; the centroid path stays available either way.
  # The flag values below are pinned across all sweeps so absolute novelty
  # numbers stay comparable -- changing alignment-type or max-seqs invalidates
  # cross-checkpoint comparisons.
  foldseek_target_dbs: "pdb=/rds/user/sr2173/hpc-work/proteina/foldseek_dbs/pdb/db,afdb_swissprot=/rds/user/sr2173/hpc-work/proteina/foldseek_dbs/afdb_swissprot/db"
  foldseek_alignment_type: 1     # 1=full TMalign (correct); 2=3Di+refine inflates novelty when 3Di prefilter misses (see 2026-05-17 audit). 0=Gotoh-only.
  foldseek_max_seqs: 1000        # prefilter survivors per query
  foldseek_sensitivity: 9.5      # Foldseek -s
  foldseek_threads: 0            # 0 = let Foldseek pick all cores
  foldseek_filter_designable: true  # match paper App. F (designable subset only)

  # Secondary-structure (P-SEA) JSD references. With these set, every metric run
  # emits `_res_ss_*` columns (H/E/C fractions, JSD vs PDB and AFDB, designable
  # subset variants, 2-D JSD). Reference .pt files built one-off by
  # evaluation/proteina/generation/scripts/precompute_ss_reference.py. Made a
  # default 2026-05-17 — previously each profile had to opt in, which led to
  # convergence sweeps missing SS columns entirely (see drift audit).
  ss_reference_pdb_path:  /rds/user/sr2173/hpc-work/proteina/data/ss_reference_pdb.pt
  ss_reference_afdb_path: /rds/user/sr2173/hpc-work/proteina/data/ss_reference_afdb.pt

# n=512: full convergence curve (11-12 log-spaced checkpoints per run)
n512_convergence:
  <<: *defaults
  runs: "baseline,repa_l0,repa_l4,repa_l9"
  output_dir: results/lite/n512_convergence_lite

# n=128: sample-matched @ ~19.5M samples (baseline step=800K, repa step=400K)
n128:
  <<: *defaults
  runs: "baseline_128,repa_l0_128,repa_l4_128,repa_l9_128"
  output_dir: results/lite/n128_lite

# n=256: sample-matched @ ~7M samples (all runs step=400K)
n256:
  <<: *defaults
  runs: "baseline_256,repa_l0_256,repa_l4_256,repa_l9_256"
  output_dir: results/lite/n256_lite

# n=512: sample-matched @ 3.0M samples (baseline step=500K, repa step=750K)
n512_sm:
  <<: *defaults
  runs: "baseline_512_sm,repa_l0_512_sm,repa_l4_512_sm,repa_l9_512_sm"
  output_dir: results/lite/n512_sm_lite

# n=128 L4 bs=80 sweep: 1 baseline + 3 REPA-L4 variants, each at mid (8M) + end (~16M)
# samples. All bs=80 throughout, so steps == samples / 80. lr3x has no step=200K
# checkpoint yet (training stopped at ~165K) so the registry uses None there,
# which find_checkpoint_path resolves to last-EMA.ckpt (~13M samples).
#
# Renamed 2026-05-06 from n128_bs80_sweep -> n128_L4_bs80 to make the
# layer-4-only scope explicit (cf. n128, which is a L0/L4/L9 layer ablation).
n128_L4_bs80:
  <<: *defaults
  runs: "baseline_128_bs80,repa_l4_128_bs80,repa_l4_128_bs80_lr3x,repa_l4_128_random"
  output_dir: results/lite/n128_L4_bs80_lite

# ─────────────────────────────────────────────────────────────────────────── #
# n=256 paper-protocol sweeps (epoch-matched checkpoints).
#
# Unified protocol: ONE generation pool per ckpt drives all metric families.
#   Length grid: {50, 75, 100, 125, 150, 175, 200, 225, 250} (step 25 from 50)
#   Samples/length: 125 (paper App. F convention)
#   Total PDBs per ckpt: 1125
# FID/fJSD/fS run on the full 1125-PDB pool. Designability runs on the 5
# paper-protocol lengths {50, 100, 150, 200, 250} with 50 PDBs per length
# (= 250 PDBs total) via designability_lengths + designability_subset_per_length
# below. Diversity and novelty then run on whichever of those 250 are
# designable (no further subsampling). One SLURM task per ckpt.
#
# baseline_256_ep21 appears in both n256_paper_pdb and n256_paper_random;
# the second sweep reuses cached PDBs (same output_suffix → same eval_output
# dir) so generation is skipped on the second pass — only metrics re-run.
# Step rationale documented in evaluation/proteina/lib/checkpoints.py.
# ─────────────────────────────────────────────────────────────────────────── #

# Designability is per-length (50 PDBs sampled at EACH of the listed lengths,
# paper App. F: 50 × 5 = 250 evaluated). Lengths must be a subset of
# nres_lens in inference_fid_60m_paper.yaml. Diversity and novelty run on
# *all* designable PDBs from this 250-PDB set with no further subsampling
# — at ≤50/length the pairwise-TM cost is seconds.
_paper_defaults: &paper_defaults
  <<: *defaults
  designability_subset_per_length: 50
  designability_lengths: "50,100,150,200,250"
  metrics: "fid,designability,diversity,novelty_foldseek,ss"

# Main PDB-trained comparison (drop _random; target ~ep24, span ep21-26)
n256_paper_pdb:
  <<: *paper_defaults
  runs: "baseline_256_ep21,repa_l0_256_ep26,repa_l4_256_ep22,repa_l9_256_ep25"
  output_dir: results/paper/n256_paper_pdb

# PDB-trained sweep including _random (capped at ep17)
n256_paper_random:
  <<: *paper_defaults
  runs: "baseline_256_ep21,repa_l9_256_ep17,repa_l4_256_random_ep17"
  output_dir: results/paper/n256_paper_random

# AFDB-Swissprot-trained comparison (epoch 20 exact match)
n256_paper_afdb:
  <<: *paper_defaults
  runs: "baseline_afdb_256_ep20,repa_l4_afdb_256_ep20"
  output_dir: results/paper/n256_paper_afdb

# External pretrained reference: NVIDIA NGC DFS-60M v1.3 (12 layers, ep=177,
# global_step=1.3M) evaluated through the n=256 paper protocol so it lands as
# a top "reference" row in the n=256 plot. Mirrors n128_paper_pretrained.
n256_paper_pretrained:
  <<: *paper_defaults
  runs: "pretrained_dfs_60m_n256_paper"
  output_dir: results/paper/n256_paper_pretrained

# Averaging-ablation evaluation: 3 per_sample variants (L0/L4/L9) at last-EMA.
# Companions to the L0 ep26 / L4 ep22 / L9 ep25 per_residue rows already in
# n256_paper_pdb. Output dir is its own to keep the per_sample jsonl separate
# from the per_residue main comparison; tables/plots can union them.
n256_paper_averaging:
  <<: *paper_defaults
  runs: "repa_l0_256_per_sample_steplast,repa_l4_256_per_sample_step400k,repa_l9_256_per_sample_steplast"
  output_dir: results/paper/n256_paper_averaging

# ESM2 encoder ablation row at n=256. Only on-disk 256 ESM run is L9-t30 at
# bs=12 throughout (ESM-650M OOMs at bs=24). Comparison to the bs=24 encoder
# block is unfair on the bs axis AND the layer axis (L9-t30 vs L4 default);
# both gaps are footnoted in n256_paper_tables.md.
n256_paper_esm:
  <<: *paper_defaults
  runs: "repa_esm_l9_t30_256_steplast"
  output_dir: results/paper/n256_paper_esm

# ProteinMPNN encoder ablation row at n=256. Latest numbered EMA snapshot is
# step=300K (May 9 12:46); not step-matched to the CA-GearNet L4 ep22 anchor
# (step=400K) — note in the table when consolidating. Will add a _step400k
# entry once that snapshot lands.
n256_paper_mpnn:
  <<: *paper_defaults
  runs: "repa_mpnn_l4_256_per_residue_step300k"
  output_dir: results/paper/n256_paper_mpnn

# λ ablation at n=256: REPA L4, PDB, per_residue, varying λ. λ=0.5 leg
# reuses the existing `repa_l4_256_ep22` (step=400K) anchor from
# n256_paper_pdb. λ=1.0 / λ=2.0 are still training; pinned at the latest
# numbered EMA snapshot available (300K / 200K). Not step-matched to the
# λ=0.5 anchor — footnote when consolidating; bump to _step400k entries
# once those snapshots land.
n256_paper_lambda:
  <<: *paper_defaults
  runs: "repa_l4_256_per_residue_lambda1_step300k,repa_l4_256_per_residue_lambda2_step200k"
  output_dir: results/paper/n256_paper_lambda

# Step-matched-to-L9-ep17 reference: L4 at step=300K (epoch=13, pre-bs-bump).
# Companion to `repa_l9_256_ep17` for testing per-layer designability onset.
n256_paper_l4_step300k:
  <<: *paper_defaults
  runs: "repa_l4_256_ep13_step300k"
  output_dir: results/paper/n256_paper_l4_step300k

# Final dated snapshot of the canonical n256 REPA L4 per_residue run at
# step=500K (ep31, ~10.49M samples). Companion to `repa_l4_256_ep22`
# (step=400K) — the original n256_paper_pdb anchor — for an "extra
# training" comparison point on the same run. Union with n256_paper_pdb
# when tabulating to add a step=500K column to the L4 row.
n256_paper_l4_step500k:
  <<: *paper_defaults
  runs: "repa_l4_256_ep31_step500k"
  output_dir: results/paper/n256_paper_l4_step500k

# ─────────────────────────────────────────────────────────────────────────── #
# n=128 paper-protocol sweeps (mirrors n=256 paper but truncated to in-
# distribution lengths {50, 75, 100, 125}). 500 PDBs/ckpt; designability on
# 50/length × 4 lengths = 200 PDBs. Step suffixes (_step100k / _step200k /
# _step400k / _steplast) are baked into RUN_SCHEDULES keys so each row
# pins to a specific snapshot.
#
# Three ablations, each its own profile so plots are independent:
#   layer    — baseline + l0 / l4 / l9 @ bs=80 (step=200K for baseline+l4,
#              last-EMA for l0/l9 since they have not reached 200K yet — REDO
#              once they do; plot needs an asterisk)
#   encoder  — baseline + 6 REPA targets @ L4 bs=80 (step=200K for 5 of 7,
#              step=100K for pw_structure / pw_torsional which have nothing
#              past 100K — note in plot caption)
#   bs_lr    — clean factorial of bs ∈ {24, 80} × lr ∈ {1×, 3×} ± REPA. Sub-
#              question 1: step=200K for all 6 runs. Sub-question 2: step=400K
#              for the two bs=24 runs only (extra training, sample-matched
#              vs bs=80@200K = 16M).
#
# TODO (lambda ablation): defer until proteina_60m_repa_l4_128_per_residue_
# bs80_lambda1 (λ=1.0) and _lambda2 (λ=2.0, currently 17.5K) reach 100K-step
# EMA. The bs80 entry (λ=0.5) is the third leg already.
# ─────────────────────────────────────────────────────────────────────────── #

# Designability is per-length (50 PDBs sampled at each of the 4 listed lengths,
# so 50 × 4 = 200 evaluated). Lengths must be a subset of nres_lens in
# inference_fid_60m_n128_paper.yaml (= the same set, in this case).
_paper_n128_defaults: &paper_n128_defaults
  <<: *defaults
  designability_subset_per_length: 50
  designability_lengths: "50,75,100,125"
  metrics: "fid,designability,diversity,novelty_foldseek,ss"

# Ablation 1: layer ablation (4 tasks)
n128_paper_layer:
  <<: *paper_n128_defaults
  runs: "baseline_128_bs80_step200k,repa_l0_128_bs80_step200k,repa_l4_128_bs80_step200k,repa_l9_128_bs80_step200k"
  output_dir: results/paper/n128_paper_layer

# Ablation 2: encoder ablation (7 tasks)
n128_paper_encoder:
  <<: *paper_n128_defaults
  runs: "baseline_128_bs80_step200k,repa_l4_128_bs80_step200k,repa_l4_128_random_step200k,repa_l4_128_pw_structure_step100k,repa_l4_128_pw_torsional_step100k,repa_mpnn_l4_128_bs80_step200k,repa_esm_l4_128_step200k"
  output_dir: results/paper/n128_paper_encoder

# Ablation 3: batch-size + LR ablation (8 tasks = 6 @ step200k + 2 extras
# @ step400k for the bs=24 runs).
n128_paper_bs_lr:
  <<: *paper_n128_defaults
  runs: "baseline_128_bs24_step200k,baseline_128_bs24_step400k,baseline_128_bs80_step200k,baseline_128_bs80_lr3x_step200k,repa_l4_128_bs24_step200k,repa_l4_128_bs24_step400k,repa_l4_128_bs80_step200k,repa_l4_128_bs80_lr3x_steplast"
  output_dir: results/paper/n128_paper_bs_lr

# External pretrained reference: NVIDIA NGC DFS-60M v1.3 (12 layers, ep=177,
# global_step=1.3M) evaluated through the same paper protocol so it lands as
# a top "reference" row in the n=128 plot.
n128_paper_pretrained:
  <<: *paper_n128_defaults
  runs: "pretrained_dfs_60m_n128_paper"
  output_dir: results/paper/n128_paper_pretrained

# n=128 per-residue layer ablation (mixed-bs runs at step=400k). All three
# REPA students share the same bs=24→80 schedule (bump at step=220k), so
# cross-layer comparison is fair despite the bs bump. Companion to the bs=80
# layer ablation above; helpful sanity check that the layer ranking holds
# at the larger sample budget (~19.68M vs 16M).
n128_paper_layer_per_residue:
  <<: *paper_n128_defaults
  runs: "baseline_128_bs24_step400k,repa_l0_128_per_residue_step400k,repa_l4_128_per_residue_step400k,repa_l9_128_per_residue_step400k"
  output_dir: results/paper/n128_paper_layer_per_residue

# λ ablation: REPA L4 bs=80 with varying KL weight. λ=0.5 leg reuses the
# existing `repa_l4_128_bs80_step200k` cell; λ=2.0 evaluated at last-EMA
# (~step 182K, ~14.5M samples). λ=1.0 deferred — its training was parked
# at step 3.5K and was relaunched 2026-05-08.
n128_paper_lambda:
  <<: *paper_n128_defaults
  runs: "repa_l4_128_bs80_step200k,repa_l4_128_bs80_lambda2_steplast"
  output_dir: results/paper/n128_paper_lambda

# Weight-decay ablation: REPA L4 bs=80 with default wd vs wd=1e-2. Default-wd
# leg reuses the existing `repa_l4_128_bs80_step200k` cell so cross-block rows
# stay consistent; wd1e-2 evaluated at the matching step=200K snapshot.
n128_paper_wd:
  <<: *paper_n128_defaults
  runs: "repa_l4_128_bs80_step200k,repa_l4_128_bs80_wd1e2_step200k"
  output_dir: results/paper/n128_paper_wd

# ─────────────────────────────────────────────────────────────────────────── #
# 2026-05-14 follow-up sweeps — same paper protocols, but with foldseek
# novelty INLINE (metrics override adds `novelty_foldseek`) instead of the
# post-hoc backfill we used for the earlier rows. Separate output_dirs so
# the new sweep_results.jsonl files merge cleanly into the master tsv via
# jsonl_to_tsv.py without disturbing existing rows. Foldseek DB paths +
# protocol flags are inherited from `defaults` (lines 79-84 above).
# ─────────────────────────────────────────────────────────────────────────── #

# n=128 lambda extension: new λ=0.25 and λ=1.0 legs at step=200K, joining
# the existing λ=0.5 / λ=2.0 rows in n128_paper_lambda.
n128_paper_lambda_ext:
  <<: *paper_n128_defaults
  runs: "repa_l4_128_bs80_lambda025_step200k,repa_l4_128_bs80_lambda1_step200k"
  output_dir: results/paper/n128_paper_lambda_ext
  metrics: "fid,designability,diversity,novelty_foldseek,ss"

# n=128 AFDB-Swissprot block: brand-new ablation group (mirrors n256 AFDB).
# 5 tasks: baseline + l4 + mpnn-l4 @ step=200K; baseline + mpnn-l4 also at
# step=400K. All eff_bs=80 via per-GPU 40 × 2-GPU DDP.
n128_paper_afdb:
  <<: *paper_n128_defaults
  runs: "baseline_afdb_128_bs80_step200k,baseline_afdb_128_bs80_step400k,repa_l4_afdb_128_bs80_step200k,repa_mpnn_l4_afdb_128_bs80_step200k,repa_mpnn_l4_afdb_128_bs80_step400k"
  output_dir: results/paper/n128_paper_afdb
  metrics: "fid,designability,diversity,novelty_foldseek,ss"

# n=128 AFDB extension (2026-05-16): close the 4-way comparison at 600K
# (max for repa_l4_afdb), then long-tail at 800K/1M for baseline + mpnn-L4
# and 1200K for baseline only (mpnn-L4 store maxes at 1100K). 8 tasks, shares
# the existing n128_paper_afdb jsonl/output_dir so plots stay unified.
n128_paper_afdb_ext:
  <<: *paper_n128_defaults
  runs: "baseline_afdb_128_bs80_step600k,baseline_afdb_128_bs80_step800k,baseline_afdb_128_bs80_step1000k,baseline_afdb_128_bs80_step1200k,repa_l4_afdb_128_bs80_step600k,repa_mpnn_l4_afdb_128_bs80_step600k,repa_mpnn_l4_afdb_128_bs80_step800k,repa_mpnn_l4_afdb_128_bs80_step1000k"
  output_dir: results/paper/n128_paper_afdb
  metrics: "fid,designability,diversity,novelty_foldseek,ss"

# n=256 AFDB extension (HIGHEST PRIORITY per user 2026-05-14):
# step-curve at 400/700/900K for baseline; 400/700K for repa_l4 and
# mpnn-l9; 400K for mpnn-l4. 8 tasks.
n256_paper_afdb_ext:
  <<: *paper_defaults
  runs: "baseline_afdb_256_step400k,baseline_afdb_256_step700k,baseline_afdb_256_step900k,repa_l4_afdb_256_step400k,repa_l4_afdb_256_step700k,repa_mpnn_l4_afdb_256_step400k,repa_mpnn_l9_afdb_256_step400k,repa_mpnn_l9_afdb_256_step700k"
  output_dir: results/paper/n256_paper_afdb_ext
  metrics: "fid,designability,diversity,novelty_foldseek,ss"

# CA-GearNet L9 AFDB-256 step-curve (added 2026-05-16): missing leg of the
# n=256 AFDB encoder ablation; shortest run (last-EMA 423.5k). 200k, 400k,
# steplast (=last-EMA). Shares the n256_paper_afdb_ext output dir so plots
# pick up the L9-GN row alongside L4-GN, MPNN-L4, MPNN-L9.
n256_paper_afdb_l9_gn:
  <<: *paper_defaults
  runs: "repa_l9_afdb_256_step200k,repa_l9_afdb_256_step400k,repa_l9_afdb_256_steplast"
  output_dir: results/paper/n256_paper_afdb_ext
  metrics: "fid,designability,diversity,novelty_foldseek,ss"

# n=256 lambda extension: λ=1.0 at step=200K and λ=2.0 at step=300K, paired
# with the existing _step300k / _step200k anchors so each λ leg now has 2
# step points.
n256_paper_lambda_ext:
  <<: *paper_defaults
  runs: "repa_l4_256_per_residue_lambda1_step200k,repa_l4_256_per_residue_lambda2_step300k"
  output_dir: results/paper/n256_paper_lambda_ext
  metrics: "fid,designability,diversity,novelty_foldseek,ss"

# ─────────────────────────────────────────────────────────────────────────── #
# n=256 convergence sweep (added 2026-05-16) — REPA-paper-style step curves.
# 9-config matrix: {PDB, AFDB} × baseline + {PDB, AFDB} × {L4, L9} × {GearNet,
# MPNN}, minus PDB L9 MPNN (no periodic ckpt). Target steps {100k, 200k, 400k,
# 700k, 1000k, 1300k, 1600k}; steps above each run's max are skipped (no
# snap-to-last). 47 unique ckpts (21 PDB + 26 AFDB). Run as one array per
# subset; 1:30 wall/task with the post-2026-05-15 TF32+inference_mode speedup.
# Note: centroid_path stays at PDB default — TM-centroid novelty is the
# secondary metric here; the primary novelty signal is foldseek against both
# pdb and afdb_swissprot DBs (foldseek_target_dbs in defaults).
# ─────────────────────────────────────────────────────────────────────────── #

n256_convergence_pdb:
  <<: *paper_defaults
  runs: "baseline_256_bs24_2gpu_step100k,baseline_256_bs24_2gpu_step200k,baseline_256_bs24_2gpu_step400k,baseline_256_bs24_2gpu_step700k,baseline_256_bs24_2gpu_step1000k,baseline_256_bs24_2gpu_step1300k,repa_l4_256_per_residue_bs24_2gpu_step100k,repa_l4_256_per_residue_bs24_2gpu_step200k,repa_l4_256_per_residue_bs24_2gpu_step400k,repa_l4_256_per_residue_bs24_2gpu_step700k,repa_mpnn_l4_256_per_residue_step100k,repa_mpnn_l4_256_per_residue_step200k,repa_mpnn_l4_256_per_residue_step400k,repa_mpnn_l4_256_per_residue_step700k,repa_mpnn_l4_256_per_residue_step1000k,repa_mpnn_l4_256_per_residue_step1300k,repa_mpnn_l4_256_per_residue_step1600k,repa_l9_256_per_residue_bs24_2gpu_step100k,repa_l9_256_per_residue_bs24_2gpu_step200k,repa_l9_256_per_residue_bs24_2gpu_step400k,repa_l9_256_per_residue_bs24_2gpu_step700k"
  output_dir: results/paper/n256_convergence_pdb
